<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Dashboard</title>
    <style>
        /* Overlay styles */
        #passwordOverlay {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #passwordInput {
            padding: 10px;
            font-size: 16px;
        }
        #overlayContent {
            color: white;
        }
    </style>
</head>
<body>
    <div id="passwordOverlay">
        <div id="overlayContent">
            <h2>Enter Password</h2>
            <input type="password" id="passwordInput" placeholder="Enter PIN/password" />
            <button onclick="unlockPublicDash()">Submit</button>
        </div>
    </div>

    <div id="publicDashboard" style="display: none;">
        <h1>Welcome to the Public Dashboard</h1>
        <!-- Existing content for the public dashboard goes here -->
    </div>

    <script>
        function unlockPublicDash() {
            const input = document.getElementById('passwordInput').value;
            if (input === 'demo2024') {
                openPublic();
            } else {
                alert('Incorrect password. Please try again.');
            }
        }

        function openPublic() {
            document.getElementById('passwordOverlay').style.display = 'none';
            document.getElementById('publicDashboard').style.display = 'block';
        }

        function closePublic() {
            document.getElementById('passwordOverlay').style.display = 'flex';
            document.getElementById('publicDashboard').style.display = 'none';
        }
    </script>
</body>
</html>
